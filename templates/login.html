<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Requise - Basic-Fit Manager</title>
  <link rel="icon" href="{{ url_for('static', filename='images.ico') }}" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='index.css') }}">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0d0f17;
      color: #f5f6fa;
      font-family: 'Space Grotesk', -apple-system, sans-serif;
    }
    .login-card {
      background: rgba(22, 26, 38, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      backdrop-filter: blur(16px);
      text-align: center;
    }
    .lock-icon {
      width: 64px;
      height: 64px;
      background: rgba(255, 106, 43, 0.15);
      color: #ff6a2b;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 20px;
    }
    .brand-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .form-control {
      background: rgba(13, 15, 23, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 1rem;
      text-align: center;
      letter-spacing: 2px;
    }
    .form-control:focus {
      background: rgba(13, 15, 23, 0.95);
      border-color: #ff6a2b;
      color: #ffffff;
      box-shadow: 0 0 0 3px rgba(255, 106, 43, 0.25);
    }
    .btn-login {
      background: linear-gradient(135deg, #ff6a2b, #ff854d);
      border: none;
      color: white;
      font-weight: 600;
      padding: 14px;
      border-radius: 12px;
      width: 100%;
      font-size: 1rem;
      box-shadow: 0 4px 15px rgba(255, 106, 43, 0.35);
      transition: all 0.2s ease;
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #ff854d, #ffa270);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="lock-icon">
      <i class="bi bi-shield-lock"></i>
    </div>
    <h1 class="brand-title">Accès Sécurisé</h1>
    <p class="text-muted small mb-4">Veuillez entrer votre clé d'accès pour continuer.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category if category != 'error' else 'danger' }} py-2 small mb-3">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="/login">
      <div class="mb-3">
        <input type="password" name="password" class="form-control" placeholder="Clé d'accès..." autocomplete="current-password" required autofocus>
      </div>
      <button type="submit" class="btn btn-login">
        <i class="bi bi-unlock me-2"></i>Déverrouiller
      </button>
    </form>
  </div>
</body>
</html>
